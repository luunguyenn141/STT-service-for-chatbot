name: msb-stt-production

services:
  stt-service:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        INSTALL_PHOWHISPER: "true"
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cu126
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env.production}
    gpus: all
    ports:
      - "${DIRECT_HTTP_PORT:-8080}:8000"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - hf_cache:/app/.cache/huggingface
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first boot downloads and loads the selected PhoWhisper model.
      start_period: 5m

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      stt-service:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - backend
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Outbound access is retained for the initial Hugging Face model download
  # and package/image updates.
  backend:

volumes:
  hf_cache:
  caddy_data:
  caddy_config:
