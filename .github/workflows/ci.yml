name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Serialize main builds; superseded PR checks can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same VCR repository as PFM, with a separate image name.
  IMAGE: ${{ vars.VCR_IMAGE || 'vcr.vngcloud.vn/111480-abp114564/stt-service' }}
  # Isolated lightweight image for the Vbee trial; does not replace PhoWhisper.
  VBEE_IMAGE: ${{ vars.VCR_VBEE_IMAGE || 'vcr.vngcloud.vn/111480-abp114564/stt-service-vbee' }}

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install System Dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          ELEVENLABS_API_KEY: dummy-key-for-test
          STT_PROVIDER: elevenlabs
        run: python -m pytest --verbose

  docker-build:
    name: Build PhoWhisper Image and Publish to VCR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Validate Registry Configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VCR_USERNAME: ${{ secrets.VCR_USERNAME }}
          VCR_PASSWORD: ${{ secrets.VCR_PASSWORD }}
        run: |
          if [[ -z "$VCR_USERNAME" || -z "$VCR_PASSWORD" ]]; then
            echo "::error::Set VCR_USERNAME and VCR_PASSWORD in this repository's Actions secrets. PFM repository secrets are not shared automatically."
            exit 1
          fi
          if [[ "$IMAGE" != vcr.vngcloud.vn/*/* || "$IMAGE" == *:* || "$IMAGE" == *@* || "$IMAGE" == *[[:space:]]* ]]; then
            echo "::error::VCR_IMAGE must be vcr.vngcloud.vn/<repository>/<image>, without a tag or digest."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to VNG Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: vcr.vngcloud.vn
          username: ${{ secrets.VCR_USERNAME }}
          password: ${{ secrets.VCR_PASSWORD }}

      - name: Build Image (Publish Only from Main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            INSTALL_PHOWHISPER=true
            BUNDLE_PHOWHISPER_MODEL=true
            PYTORCH_INDEX_URL=${{ vars.STT_PYTORCH_INDEX_URL || 'https://download.pytorch.org/whl/cpu' }}
          cache-from: type=gha,scope=stt-phowhisper
          # PR cache writes can be read-only and must never fail a valid image build.
          cache-to: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=stt-phowhisper,ignore-error=true' || '' }}

  vbee-docker-build:
    name: Build Vbee Image and Publish to VCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Validate Registry Configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VCR_USERNAME: ${{ secrets.VCR_USERNAME }}
          VCR_PASSWORD: ${{ secrets.VCR_PASSWORD }}
        run: |
          if [[ -z "$VCR_USERNAME" || -z "$VCR_PASSWORD" ]]; then
            echo "::error::Set VCR_USERNAME and VCR_PASSWORD in this repository's Actions secrets."
            exit 1
          fi
          if [[ "$VBEE_IMAGE" != vcr.vngcloud.vn/*/* || "$VBEE_IMAGE" == *:* || "$VBEE_IMAGE" == *@* || "$VBEE_IMAGE" == *[[:space:]]* ]]; then
            echo "::error::VCR_VBEE_IMAGE must be vcr.vngcloud.vn/<repository>/<image>, without a tag or digest."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to VNG Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: vcr.vngcloud.vn
          username: ${{ secrets.VCR_USERNAME }}
          password: ${{ secrets.VCR_PASSWORD }}

      - name: Build Image (Publish Only from Main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.VBEE_IMAGE }}:${{ github.sha }}
            ${{ env.VBEE_IMAGE }}:latest
          build-args: |
            DEFAULT_STT_PROVIDER=vbee
            INSTALL_PHOWHISPER=false
            BUNDLE_PHOWHISPER_MODEL=false
          cache-from: type=gha,scope=stt-vbee
          # PR cache writes can be read-only and must never fail a valid image build.
          cache-to: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=stt-vbee,ignore-error=true' || '' }}
